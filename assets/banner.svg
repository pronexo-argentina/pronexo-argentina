<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pronexo - Odoo ERP, Python y automatizacion con IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0E1A2F"/>
      <stop offset="1" stop-color="#0A1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3A6"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3A6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1050" cy="120" r="320" fill="url(#glow)"/>

  <!-- Red de nodos (infraestructura / pipeline) lado derecho -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.9">
    <line x1="820" y1="120" x2="960" y2="80"/>
    <line x1="960" y1="80" x2="1090" y2="150"/>
    <line x1="1090" y1="150" x2="1180" y2="90"/>
    <line x1="820" y1="120" x2="900" y2="240"/>
    <line x1="900" y1="240" x2="1090" y2="150"/>
    <line x1="900" y1="240" x2="1010" y2="320"/>
    <line x1="1010" y1="320" x2="1160" y2="290"/>
    <line x1="1090" y1="150" x2="1160" y2="290"/>
    <line x1="960" y1="80" x2="900" y2="240"/>
  </g>
  <g fill="#0B1120" stroke="url(#accent)" stroke-width="3">
    <circle cx="820" cy="120" r="9"/>
    <circle cx="960" cy="80" r="9"/>
    <circle cx="1090" cy="150" r="11"/>
    <circle cx="1180" cy="90" r="8"/>
    <circle cx="900" cy="240" r="11"/>
    <circle cx="1010" cy="320" r="9"/>
    <circle cx="1160" cy="290" r="9"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="1090" cy="150" r="4"/>
    <circle cx="900" cy="240" r="4"/>
  </g>

  <!-- Barra de acento vertical -->
  <rect x="96" y="112" width="6" height="176" rx="3" fill="url(#accent)"/>

  <!-- Wordmark -->
  <text x="128" y="185" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#wordmark)">Pronexo</text>

  <!-- Tagline -->
  <text x="130" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="1.5" fill="#38BDF8">ERP · AUTOMATIZACIÓN · INFRAESTRUCTURA</text>

  <!-- Sub-tagline -->
  <text x="130" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.5" fill="#94A3B8">Odoo · Python · FastAPI · Linux · IA — para PyMEs argentinas</text>

  <!-- Linea base de acento -->
  <rect x="0" y="392" width="1280" height="8" fill="url(#accent)"/>
</svg>
